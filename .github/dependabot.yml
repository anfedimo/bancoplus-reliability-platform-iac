# Actualización automática por PR: el CI (terraform test, tflint, Trivy) valida cada propuesta.
# Las versiones de charts en helm_release se gobiernan por variable y se revisan en cada ola.
version: 2
updates:
  - package-ecosystem: terraform
    directories: ["/modules/*", "/stacks/*/*"]
    schedule: { interval: weekly, day: monday }
    groups:
      providers: { patterns: ["*"] }
    commit-message: { prefix: ":wrench:" }
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: ":octocat:" }
