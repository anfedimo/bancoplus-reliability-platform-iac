name: terraform-ci

on:
  pull_request:
    paths: ["modules/**", "stacks/**", "charts/**", ".github/workflows/terraform-ci.yaml"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: fmt · validate · tflint · trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: tfversion
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: |
          for dir in modules/*/ stacks/*/*/; do
            [ -n "$(ls "$dir"*.tf 2>/dev/null)" ] || continue
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: shellcheck (scripts de ciclo de vida y tests)
        run: shellcheck -x -S warning scripts/*.sh
      - name: helm lint (charts locales)
        run: helm lint charts/*
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint
        run: tflint --init --config "$PWD/.tflint.hcl" && tflint --recursive --config "$PWD/.tflint.hcl"
      - name: trivy (misconfiguraciones IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Ejemplos de los módulos descargados por terraform init no son código del repositorio
          skip-dirs: "**/.terraform"
          trivyignores: .trivyignore.yaml

  module-tests:
    name: terraform test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [otel-gateway, java-autoinstrumentation, slo-burn-rate-alerts, observability-backends, github-ci-ecr-role]
    steps:
      - uses: actions/checkout@v7
      - id: tfversion
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
      - working-directory: modules/${{ matrix.module }}
        run: terraform init -backend=false -input=false && terraform test

  slo-rules:
    name: Reglas SLO generadas · promtool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: tfversion
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
          terraform_wrapper: false
      - name: promtool (binario oficial verificado por SHA-256, sin depender de un registro de imágenes)
        env:
          PROMETHEUS_VERSION: "3.13.4"
        run: |
          set -euo pipefail
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          file="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/sha256sums.txt" | grep " $file\$" | sha256sum -c -
          tar xzf "$file" --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          promtool --version | head -1
      - name: Renderizar y validar cada SLO en ambos perfiles
        working-directory: modules/slo-burn-rate-alerts
        run: |
          terraform init -backend=false -input=false >/dev/null
          mkdir -p /tmp/rules
          for slo in ../../slo/*.yaml; do
            for profile in prod poc; do
              out="/tmp/rules/$(basename "$slo" .yaml)-$profile.json"
              echo 'jsonencode({groups = [{name = "recording", rules = local.recording_rules}, {name = "alerts", rules = local.alert_rules}]})' \
                | terraform console -var "slo_file=$slo" -var namespace=ci -var "profile=$profile" \
                | python3 -c "import sys, json; print(json.loads(sys.stdin.read()))" > "$out"
            done
          done
          promtool check rules /tmp/rules/*.json
